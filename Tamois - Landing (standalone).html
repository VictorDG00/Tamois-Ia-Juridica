document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tyle>\n<style>/* ═══════════════════════════════════════════════════════\n   TAMOIS v2 — LIGHT MODE REFINADO\n   Estende tamois.css, sobrescreve apenas tokens do light theme\n   Mudanças principais:\n   · Base mais profunda (parchment escurecido) com hierarquia clara\n   · Cards = branco puro (popam sobre a base)\n   · Texto warm-black em vez de abyss-blue (combina melhor com parchment)\n   · Bordas em tom quente (tan), não frio (abyss)\n   · Sombras com matiz quente\n═══════════════════════════════════════════════════════ */\n\n/* ═══════════════════════════════════════════════════════\n   TAMOIS — IA Jurídica\n   Sistema visual baseado no LEX Design System v2.0\n   Paleta: Fiery Ocean · Type: Cormorant + Instrument + DM Mono\n═══════════════════════════════════════════════════════ */\n\n:root {\n  --molten:    #780000;\n  --crimson:   #C1121F;\n  --parchment: #FDF0D5;\n  --abyss:     #003049;\n  --steel:     #669BBC;\n\n  --font-display: 'Cormorant Garamond', Georgia, serif;\n  --font-body:    'Instrument Sans', sans-serif;\n  --font-mono:    'DM Mono', monospace;\n\n  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;\n  --s6:24px; --s8:32px; --s10:40px; --s12:48px; --s16:64px; --s20:80px;\n\n  --r1:2px; --r2:4px; --r3:8px; --r4:12px; --r5:16px; --r-full:9999px;\n\n  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);\n  --ease-in-expo:  cubic-bezier(0.7, 0, 0.84, 0);\n  --ease-inout:    cubic-bezier(0.45, 0, 0.55, 1);\n  --dur-fast: 150ms; --dur-base: 280ms;\n  --dur-slow: 500ms; --dur-enter: 650ms;\n\n  --nav-h: 60px;\n}\n\n/* ── DARK ──────────────────────────────────────────── */\n[data-theme=\"dark\"] {\n  --bg-primary:   #000F18;\n  --bg-surface:   #001928;\n  --bg-elevated:  #002036;\n  --bg-glass:     rgba(0,48,73,0.6);\n\n  --text-primary:   #FDF0D5;\n  --text-secondary: rgba(253,240,213,0.6);\n  --text-tertiary:  rgba(253,240,213,0.35);\n  --text-accent:    #669BBC;\n\n  --border-subtle:  rgba(102,155,188,0.12);\n  --border-medium:  rgba(102,155,188,0.22);\n  --border-accent:  rgba(102,155,188,0.45);\n\n  --glow-crimson: rgba(193,18,31,0.35);\n  --glow-steel:   rgba(102,155,188,0.25);\n  --glow-molten:  rgba(120,0,0,0.5);\n\n  --c-ok-text:      #72D49B; --c-ok-bg:   rgba(114,212,155,0.08); --c-ok-border:   rgba(114,212,155,0.2);\n  --c-warn-text:    #E8C76A; --c-warn-bg: rgba(232,199,106,0.08); --c-warn-border: rgba(232,199,106,0.2);\n  --c-risk-text:    #F07070; --c-risk-bg: rgba(240,112,112,0.08); --c-risk-border: rgba(240,112,112,0.2);\n  --c-info-text:    #669BBC; --c-info-bg: rgba(102,155,188,0.08); --c-info-border: rgba(102,155,188,0.2);\n  --c-neutral-text: rgba(253,240,213,0.45); --c-neutral-bg: rgba(253,240,213,0.05); --c-neutral-border: rgba(253,240,213,0.1);\n\n  --notif-bg: #001422; --notif-border: rgba(102,155,188,0.1);\n  --toast-bg: #001E30; --toast-border: rgba(102,155,188,0.15);\n  --toast-shadow: 0 8px 32px rgba(0,0,0,0.5);\n\n  --noise-opacity: 0.5;\n  --scroll-track: #000F18;\n  --scroll-thumb: rgba(102,155,188,0.2);\n  --ambient-abyss-op: 0.4;\n  --ambient-molten-op: 0.18;\n  --sidebar-hover-bg: rgba(253,240,213,0.03);\n  --sidebar-active-bg: rgba(193,18,31,0.08);\n  --input-bg: var(--bg-surface);\n}\n\n/* ── LIGHT ─────────────────────────────────────────── */\n[data-theme=\"light\"] {\n  --bg-primary:   #F5EDDA;\n  --bg-surface:   #FDF0D5;\n  --bg-elevated:  #FFFFFF;\n  --bg-glass:     rgba(253,240,213,0.8);\n\n  --text-primary:   #001E2E;\n  --text-secondary: rgba(0,30,46,0.62);\n  --text-tertiary:  rgba(0,30,46,0.38);\n  --text-accent:    #2B5E7E;\n\n  --border-subtle: rgba(0,48,73,0.1);\n  --border-medium: rgba(0,48,73,0.18);\n  --border-accent: rgba(0,48,73,0.35);\n\n  --glow-crimson: rgba(193,18,31,0.12);\n  --glow-steel:   rgba(102,155,188,0.15);\n  --glow-molten:  rgba(120,0,0,0.1);\n\n  --c-ok-text:      #1A7A46; --c-ok-bg:   rgba(26,122,70,0.07);   --c-ok-border:   rgba(26,122,70,0.2);\n  --c-warn-text:    #7A5A0A; --c-warn-bg: rgba(122,90,10,0.07);   --c-warn-border: rgba(122,90,10,0.2);\n  --c-risk-text:    #A00F1A; --c-risk-bg: rgba(160,15,26,0.07);   --c-risk-border: rgba(160,15,26,0.2);\n  --c-info-text:    #2B5E7E; --c-info-bg: rgba(43,94,126,0.07);   --c-info-border: rgba(43,94,126,0.2);\n  --c-neutral-text: rgba(0,30,46,0.42); --c-neutral-bg: rgba(0,48,73,0.05); --c-neutral-border: rgba(0,48,73,0.12);\n\n  --notif-bg: #FFFFFF; --notif-border: rgba(0,48,73,0.1);\n  --toast-bg: #FFFFFF; --toast-border: rgba(0,48,73,0.12);\n  --toast-shadow: 0 4px 20px rgba(0,0,0,0.1);\n\n  --noise-opacity: 0;\n  --scroll-track: #F5EDDA;\n  --scroll-thumb: rgba(0,48,73,0.15);\n  --ambient-abyss-op: 0;\n  --ambient-molten-op: 0;\n  --sidebar-hover-bg: rgba(0,48,73,0.04);\n  --sidebar-active-bg: rgba(193,18,31,0.06);\n  --input-bg: #FFFFFF;\n}\n\n/* ── BASE ──────────────────────────────────────────── */\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { scroll-behavior: smooth; }\n\nbody {\n  font-family: var(--font-body);\n  background: var(--bg-primary);\n  color: var(--text-primary);\n  font-size: 15px; line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n  overflow-x: hidden; min-height: 100vh;\n  transition: background var(--dur-base) var(--ease-out-expo),\n              color var(--dur-base) var(--ease-out-expo);\n}\n\nbody::before {\n  content: ''; position: fixed; inset: 0; z-index: 0;\n  background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E\");\n  pointer-events: none; opacity: var(--noise-opacity);\n}\n\n.ambient { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(80px); animation: drift 20s ease-in-out infinite alternate; }\n.ambient-1 { width: 600px; height: 600px; top: -200px; right: -100px; background: radial-gradient(circle, var(--abyss), transparent 70%); opacity: var(--ambient-abyss-op); }\n.ambient-2 { width: 400px; height: 400px; bottom: -100px; left: -100px; background: radial-gradient(circle, var(--molten), transparent 70%); opacity: var(--ambient-molten-op); animation-delay: -10s; }\n@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,-40px) scale(1.08); } }\n\n::-webkit-scrollbar { width: 6px; height: 6px; }\n::-webkit-scrollbar-track { background: var(--scroll-track); }\n::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }\n\n/* ── TOP NAV ───────────────────────────────────────── */\n.nav {\n  position: fixed; top: 0; left: 0; right: 0; z-index: 100;\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 0 var(--s8); height: var(--nav-h);\n  background: color-mix(in srgb, var(--bg-elevated) 88%, transparent);\n  border-bottom: 1px solid var(--border-subtle);\n  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);\n}\n.brand {\n  display: flex; align-items: center; gap: var(--s3);\n  text-decoration: none; color: inherit;\n}\n.brand-mark {\n  width: 26px; height: 26px; border-radius: var(--r2);\n  background: linear-gradient(135deg, var(--crimson), var(--molten));\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-display); font-size: 16px; color: var(--parchment);\n  box-shadow: 0 0 16px var(--glow-crimson);\n  position: relative;\n}\n.brand-mark::after {\n  content: ''; position: absolute; inset: 1px;\n  border-radius: 3px; border: 1px solid rgba(253,240,213,0.18);\n  pointer-events: none;\n}\n.brand-name {\n  font-family: var(--font-display); font-size: 20px; font-weight: 400;\n  letter-spacing: 0.08em; color: var(--text-primary);\n}\n.brand-tag {\n  font-family: var(--font-mono); font-size: 9px;\n  letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--text-tertiary); margin-left: var(--s2);\n}\n\n.nav-links { display: flex; gap: var(--s2); list-style: none; }\n.nav-links a {\n  font-size: 13px; color: var(--text-secondary); text-decoration: none;\n  padding: var(--s2) var(--s4); border-radius: var(--r2);\n  transition: all var(--dur-fast); position: relative;\n}\n.nav-links a:hover { color: var(--text-primary); background: var(--sidebar-hover-bg); }\n.nav-links a.active { color: var(--text-primary); }\n.nav-links a.active::after {\n  content: ''; position: absolute; left: var(--s4); right: var(--s4); bottom: 2px;\n  height: 1px; background: var(--crimson);\n}\n.nav-links .nav-num {\n  font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary);\n  letter-spacing: 0.1em; margin-right: 4px;\n}\n\n.nav-actions { display: flex; align-items: center; gap: var(--s3); }\n\n/* theme toggle (inline in nav) */\n.theme-toggle {\n  display: flex; align-items: center; gap: 2px;\n  background: var(--bg-surface);\n  border: 1px solid var(--border-subtle);\n  border-radius: var(--r-full); padding: 3px;\n}\n.theme-opt {\n  font-family: var(--font-mono); font-size: 9px;\n  letter-spacing: 0.12em; text-transform: uppercase;\n  padding: 4px var(--s3); border-radius: var(--r-full);\n  color: var(--text-tertiary); cursor: pointer;\n  transition: all var(--dur-fast); user-select: none;\n  background: none; border: none;\n}\n.theme-opt.active { background: var(--bg-elevated); color: var(--text-primary); box-shadow: 0 1px 4px rgba(0,0,0,0.2); }\n\n/* ── TYPOGRAPHY HELPERS ────────────────────────────── */\n.t-display-xl  { font-family: var(--font-display); font-size: 56px; font-weight: 300; letter-spacing: -0.02em; line-height: 1; color: var(--text-primary); }\n.t-display-lg  { font-family: var(--font-display); font-size: 36px; font-weight: 400; line-height: 1.1; color: var(--text-primary); }\n.t-display-md  { font-family: var(--font-display); font-style: italic; font-size: 24px; font-weight: 300; color: var(--text-secondary); }\n.t-heading-lg  { font-family: var(--font-body); font-size: 20px; font-weight: 500; letter-spacing: -0.01em; color: var(--text-primary); }\n.t-heading-sm  { font-family: var(--font-body); font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary); }\n.t-body        { font-family: var(--font-body); font-size: 15px; font-weight: 400; line-height: 1.7; color: var(--text-secondary); }\n.t-caption     { font-family: var(--font-body); font-size: 12px; color: var(--text-tertiary); line-height: 1.5; }\n.t-mono        { font-family: var(--font-mono); font-size: 13px; color: var(--text-accent); letter-spacing: 0.04em; }\n.t-label       { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-tertiary); }\n.t-italic      { font-family: var(--font-display); font-style: italic; color: var(--text-secondary); font-weight: 300; }\n\n/* ── BUTTONS ───────────────────────────────────────── */\n.btn {\n  display: inline-flex; align-items: center; gap: var(--s2);\n  border-radius: var(--r2); font-family: var(--font-body);\n  cursor: pointer; border: none; outline: none;\n  transition: all var(--dur-base) var(--ease-out-expo);\n  position: relative; overflow: hidden; white-space: nowrap; text-decoration: none;\n}\n.btn-primary {\n  background: var(--crimson); color: var(--parchment);\n  padding: var(--s3) var(--s6); font-size: 14px; font-weight: 500; letter-spacing: 0.02em;\n  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);\n}\n.btn-primary:hover { background: #D4161F; box-shadow: 0 0 24px var(--glow-crimson), inset 0 1px 0 rgba(255,255,255,0.12); transform: translateY(-1px); }\n.btn-primary:active { transform: translateY(0); }\n\n.btn-secondary {\n  background: transparent; color: var(--text-primary);\n  padding: var(--s3) var(--s6); font-size: 14px; font-weight: 400;\n  border: 1px solid var(--border-medium); letter-spacing: 0.02em;\n}\n.btn-secondary:hover { border-color: var(--border-accent); background: rgba(102,155,188,0.06); box-shadow: 0 0 16px var(--glow-steel); }\n\n.btn-ghost { background: transparent; color: var(--text-secondary); padding: var(--s3) var(--s5); font-size: 14px; border: 1px solid transparent; }\n.btn-ghost:hover { color: var(--text-primary); border-color: var(--border-subtle); }\n\n.btn-danger { background: rgba(120,0,0,0.35); color: #FF6B6B; padding: var(--s3) var(--s6); font-size: 14px; border: 1px solid rgba(193,18,31,0.35); }\n.btn-danger:hover { background: rgba(193,18,31,0.5); border-color: var(--crimson); }\n[data-theme=\"light\"] .btn-danger { background: rgba(160,15,26,0.06); color: #A00F1A; border-color: rgba(160,15,26,0.2); }\n[data-theme=\"light\"] .btn-danger:hover { background: rgba(160,15,26,0.12); }\n\n.btn-icon { background: var(--bg-elevated); color: var(--text-secondary); padding: var(--s3); border: 1px solid var(--border-subtle); border-radius: var(--r3); width: 40px; height: 40px; justify-content: center; }\n.btn-icon:hover { color: var(--text-primary); border-color: var(--border-medium); }\n\n.btn-sm { padding: 6px var(--s4); font-size: 12px; }\n.btn-lg { padding: 14px var(--s8); font-size: 15px; }\n.btn-block { width: 100%; justify-content: center; }\n\n/* ── INPUTS ────────────────────────────────────────── */\n.field { display: flex; flex-direction: column; gap: var(--s2); }\n.label {\n  font-family: var(--font-mono); font-size: 10px;\n  letter-spacing: 0.15em; text-transform: uppercase;\n  color: var(--text-tertiary);\n}\n.input, .select, .textarea {\n  width: 100%; background: var(--input-bg); border: 1px solid var(--border-subtle);\n  border-radius: var(--r2); padding: var(--s3) var(--s4);\n  font-family: var(--font-body); font-size: 14px; color: var(--text-primary); outline: none;\n  transition: border-color var(--dur-base), box-shadow var(--dur-base), background var(--dur-base);\n  -webkit-appearance: none; appearance: none;\n}\n.input::placeholder, .textarea::placeholder { color: var(--text-tertiary); }\n.input:focus, .select:focus, .textarea:focus { border-color: var(--steel); box-shadow: 0 0 0 3px rgba(102,155,188,0.12); }\n.textarea { resize: vertical; min-height: 80px; line-height: 1.5; }\n\n.select {\n  background-image: url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23669BBC' stroke-width='1.2' fill='none' stroke-linecap='round'/><\u002Fsvg>\");\n  background-repeat: no-repeat; background-position: right var(--s4) center;\n  padding-right: var(--s8);\n}\n\n.input-hint { font-size: 12px; color: var(--text-tertiary); }\n.input-hint.error { color: var(--c-risk-text); }\n\n/* checkbox / radio */\n.checkbox { display: inline-flex; align-items: center; gap: var(--s3); cursor: pointer; font-size: 13px; color: var(--text-secondary); }\n.checkbox input { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; border: 1px solid var(--border-medium); border-radius: 3px; background: var(--bg-surface); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; transition: all var(--dur-fast); }\n.checkbox input:checked { background: var(--crimson); border-color: var(--crimson); }\n.checkbox input:checked::after { content: '✓'; color: var(--parchment); font-size: 10px; line-height: 1; }\n\n/* radio card */\n.radio-card {\n  display: flex; align-items: flex-start; gap: var(--s3); cursor: pointer;\n  padding: var(--s4); border: 1px solid var(--border-subtle); border-radius: var(--r3);\n  background: var(--bg-surface); transition: all var(--dur-base);\n}\n.radio-card:hover { border-color: var(--border-medium); }\n.radio-card input { position: absolute; opacity: 0; pointer-events: none; }\n.radio-card .radio-dot {\n  width: 16px; height: 16px; border-radius: 50%;\n  border: 1px solid var(--border-medium); flex-shrink: 0; margin-top: 2px;\n  display: grid; place-items: center;\n  transition: all var(--dur-fast);\n}\n.radio-card input:checked + .radio-dot { border-color: var(--crimson); }\n.radio-card input:checked + .radio-dot::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--crimson); }\n.radio-card.checked { border-color: var(--border-accent); background: color-mix(in srgb, var(--bg-elevated) 80%, var(--crimson) 4%); }\n\n/* ── CARDS ─────────────────────────────────────────── */\n.card {\n  background: var(--bg-surface); border: 1px solid var(--border-subtle);\n  border-radius: var(--r4); padding: var(--s6); position: relative;\n  transition: all var(--dur-base) var(--ease-out-expo);\n}\n.card-elevated { background: linear-gradient(135deg, var(--bg-elevated), var(--bg-surface)); border-color: var(--border-medium); }\n.card-hover:hover { border-color: var(--border-medium); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.2); }\n\n/* ── BADGES ────────────────────────────────────────── */\n.stag {\n  display: inline-flex; align-items: center; gap: var(--s2);\n  padding: 3px var(--s3); border-left: 2px solid currentColor;\n  font-family: var(--font-mono); font-size: 10px; font-weight: 500;\n  letter-spacing: 0.1em; text-transform: uppercase;\n}\n.stag-ok      { color: var(--c-ok-text);      background: var(--c-ok-bg); }\n.stag-warn    { color: var(--c-warn-text);    background: var(--c-warn-bg); }\n.stag-risk    { color: var(--c-risk-text);    background: var(--c-risk-bg); }\n.stag-info    { color: var(--c-info-text);    background: var(--c-info-bg); }\n.stag-neutral { color: var(--c-neutral-text); background: var(--c-neutral-bg); }\n\n.norm-tag {\n  display: inline-flex; align-items: baseline; gap: 3px;\n  padding: 3px var(--s3) 3px var(--s2);\n  border: 1px solid var(--c-info-border);\n  color: var(--c-info-text); background: var(--c-info-bg);\n  border-radius: var(--r1);\n  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;\n}\n.norm-prefix { font-size: 8px; letter-spacing: 0.15em; opacity: 0.6; }\n\n.area-chip {\n  display: inline-flex; align-items: center; gap: var(--s2);\n  padding: 4px var(--s3); border-radius: var(--r-full);\n  font-family: var(--font-body); font-size: 11px; font-weight: 500;\n  border: 1px solid var(--border-medium); color: var(--text-secondary);\n  background: var(--bg-surface); cursor: default;\n  transition: all var(--dur-fast);\n}\n.area-chip:hover { color: var(--text-primary); border-color: var(--c-info-border); }\n.area-chip.is-active { color: var(--text-primary); background: var(--c-info-bg); border-color: var(--c-info-border); }\n.area-chip-icon { font-size: 10px; opacity: 0.7; }\n\n.severity { display: inline-flex; align-items: center; gap: var(--s2); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; }\n.severity-bars { display: flex; gap: 2px; align-items: flex-end; }\n.severity-bar { width: 3px; border-radius: 1px; }\n.severity-bar:nth-child(1) { height: 6px; }\n.severity-bar:nth-child(2) { height: 10px; }\n.severity-bar:nth-child(3) { height: 14px; }\n.severity-low  .severity-bar { background: var(--c-ok-text); }\n.severity-low  .severity-bar:nth-child(2), .severity-low .severity-bar:nth-child(3) { opacity: 0.2; }\n.severity-low  span { color: var(--c-ok-text); }\n.severity-med  .severity-bar { background: var(--c-warn-text); }\n.severity-med  .severity-bar:nth-child(3) { opacity: 0.2; }\n.severity-med  span { color: var(--c-warn-text); }\n.severity-high .severity-bar { background: var(--c-risk-text); }\n.severity-high span { color: var(--c-risk-text); }\n\n/* ── AI RESPONSE ───────────────────────────────────── */\n.ai-response {\n  background: var(--bg-surface); border: 1px solid var(--border-subtle);\n  border-left: 2px solid var(--steel); border-radius: var(--r3);\n  padding: var(--s6);\n}\n.ai-badge { display: inline-flex; align-items: center; gap: var(--s2); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-accent); margin-bottom: var(--s4); }\n.ai-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-accent); animation: pulse 2.5s ease-in-out infinite; }\n@keyframes pulse { 0%,100%{opacity:0.4;transform:scale(1)} 50%{opacity:1;transform:scale(1.2)} }\n.ai-text { font-family: var(--font-display); font-size: 16px; font-weight: 300; line-height: 1.8; color: var(--text-primary); }\n.ai-text strong { color: var(--text-primary); font-weight: 500; }\n\n/* ── PAGE SCAFFOLD ─────────────────────────────────── */\n.page {\n  position: relative; z-index: 1;\n  padding-top: var(--nav-h);\n  min-height: 100vh;\n}\n.container {\n  max-width: 1200px; margin: 0 auto;\n  padding: var(--s10) var(--s8);\n}\n.container-narrow { max-width: 720px; }\n.container-wide { max-width: 1400px; }\n\n.page-header {\n  display: flex; align-items: flex-end; justify-content: space-between;\n  gap: var(--s6); margin-bottom: var(--s10); flex-wrap: wrap;\n}\n.crumb {\n  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em;\n  text-transform: uppercase; color: var(--text-tertiary);\n  margin-bottom: var(--s2); display: flex; gap: var(--s2); align-items: center;\n}\n.crumb a { color: inherit; text-decoration: none; }\n.crumb a:hover { color: var(--text-secondary); }\n.crumb-sep { opacity: 0.5; }\n.page-title {\n  font-family: var(--font-display); font-size: clamp(36px, 5vw, 52px);\n  font-weight: 300; letter-spacing: -0.02em; line-height: 1.05;\n  color: var(--text-primary);\n}\n.page-subtitle {\n  font-family: var(--font-display); font-style: italic; font-weight: 300;\n  font-size: 18px; color: var(--text-secondary); margin-top: var(--s3);\n  max-width: 580px; line-height: 1.5;\n}\n\n.section-label {\n  font-family: var(--font-mono); font-size: 10px;\n  letter-spacing: 0.2em; text-transform: uppercase;\n  color: var(--text-tertiary); margin-bottom: var(--s3);\n  display: flex; align-items: center; gap: var(--s3);\n}\n.section-label::after {\n  content: ''; flex: 1; height: 1px; background: var(--border-subtle);\n}\n\n.divider {\n  height: 1px; margin: var(--s8) 0;\n  background: linear-gradient(90deg, transparent, var(--border-subtle), transparent);\n}\n\n/* ── FADE-IN ───────────────────────────────────────── */\n.fade-up { animation: fadeUp var(--dur-enter) var(--ease-out-expo) both; }\n.fade-up-1 { animation-delay: 50ms; }\n.fade-up-2 { animation-delay: 120ms; }\n.fade-up-3 { animation-delay: 200ms; }\n.fade-up-4 { animation-delay: 280ms; }\n.fade-up-5 { animation-delay: 360ms; }\n@keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }\n\n/* ── FOOTER ────────────────────────────────────────── */\n.footer {\n  border-top: 1px solid var(--border-subtle);\n  padding: var(--s10) var(--s8); margin-top: var(--s16);\n  display: flex; justify-content: space-between; align-items: center; gap: var(--s6);\n  position: relative; z-index: 1; flex-wrap: wrap;\n}\n.footer-brand { font-family: var(--font-display); font-size: 18px; font-weight: 300; color: var(--text-tertiary); letter-spacing: 0.08em; display: flex; align-items: center; gap: var(--s3); }\n.footer-meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); text-align: right; line-height: 1.8; }\n\n/* ── RESPONSIVE ────────────────────────────────────── */\n@media (max-width: 900px) {\n  .container { padding: var(--s8) var(--s5); }\n  .nav { padding: 0 var(--s5); }\n  .nav-links { display: none; }\n  .brand-tag { display: none; }\n}\n@media (max-width: 768px) {\n  .page-header { flex-direction: column; align-items: flex-start; }\n}\n\n/* ── TWEAKS PANEL ──────────────────────────────────── */\n.tweaks {\n  position: fixed; bottom: var(--s5); right: var(--s5); z-index: 200;\n  background: var(--bg-elevated); border: 1px solid var(--border-medium);\n  border-radius: var(--r4); padding: var(--s5); width: 260px;\n  box-shadow: 0 16px 48px rgba(0,0,0,0.4);\n  font-family: var(--font-body);\n}\n.tweaks-title { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: var(--s4); }\n.tweaks-row { margin-bottom: var(--s4); }\n.tweaks-row:last-child { margin-bottom: 0; }\n.tweaks-label { font-size: 11px; color: var(--text-secondary); margin-bottom: var(--s2); }\n.tweaks-seg { display: flex; gap: 2px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--r2); padding: 2px; }\n.tweaks-seg button { flex: 1; padding: 6px var(--s2); border: none; background: none; cursor: pointer; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); border-radius: var(--r1); }\n.tweaks-seg button.active { background: var(--bg-elevated); color: var(--text-primary); }\n\n/* density mod */\n[data-density=\"compact\"] .container { padding-top: var(--s8); padding-bottom: var(--s8); }\n[data-density=\"compact\"] .page-header { margin-bottom: var(--s6); }\n[data-density=\"comfortable\"] .container { padding-top: var(--s12); padding-bottom: var(--s12); }\n\n/* accent mod */\n[data-accent=\"abyss\"] { --crimson: var(--abyss); --glow-crimson: rgba(0,48,73,0.4); }\n[data-accent=\"abyss\"] .brand-mark { background: linear-gradient(135deg, var(--abyss), #001828); }\n[data-accent=\"molten\"] { --crimson: var(--molten); --glow-crimson: var(--glow-molten); }\n[data-accent=\"molten\"] .brand-mark { background: linear-gradient(135deg, var(--molten), #4a0000); }\n\n/* ── VERSION PILL (cross-link v1 ↔ v2) ─────────── */\n.version-pill {\n  display: inline-flex; align-items: center; gap: 4px;\n  font-family: var(--font-mono); font-size: 9px;\n  letter-spacing: 0.15em; text-transform: uppercase;\n  padding: 3px var(--s3); border-radius: var(--r-full);\n  background: var(--c-info-bg); color: var(--c-info-text);\n  border: 1px solid var(--c-info-border);\n  text-decoration: none; cursor: pointer;\n  transition: all var(--dur-fast);\n  white-space: nowrap;\n}\n.version-pill:hover { background: var(--c-info-border); color: var(--text-primary); }\n.version-pill-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }\n\n@media (max-width: 900px) {\n  .version-pill { display: none; }\n}\n\n\n[data-theme=\"light\"] {\n  /* ── BACKGROUNDS — hierarquia clara em 3 degraus ── */\n  --bg-primary:   #E8DEC2;   /* base mais profunda — contraste real */\n  --bg-surface:   #FAF6E9;   /* surface intermediária */\n  --bg-elevated:  #FFFFFF;   /* cards/elevated: branco puro */\n  --bg-glass:     rgba(255,255,255,0.82);\n\n  /* ── TEXT — warm-black em vez de cold abyss ── */\n  --text-primary:   #1F1A14;\n  --text-secondary: rgba(31,26,20,0.66);\n  --text-tertiary:  rgba(31,26,20,0.42);\n  --text-accent:    #2F5C7A;    /* steel um pouco mais saturado */\n\n  /* ── BORDERS — tom quente (tan), não frio ── */\n  --border-subtle: rgba(120,75,30,0.10);\n  --border-medium: rgba(120,75,30,0.18);\n  --border-accent: rgba(120,75,30,0.32);\n\n  /* ── GLOWS — discretos sobre fundo claro ── */\n  --glow-crimson: rgba(193,18,31,0.10);\n  --glow-steel:   rgba(102,155,188,0.12);\n  --glow-molten:  rgba(120,0,0,0.08);\n\n  /* ── STATUS — bases brancas + acento mais escuro ── */\n  --c-ok-text:   #156B3A;   --c-ok-bg:   rgba(21,107,58,0.06);  --c-ok-border:   rgba(21,107,58,0.22);\n  --c-warn-text: #6E4F08;   --c-warn-bg: rgba(110,79,8,0.06);   --c-warn-border: rgba(110,79,8,0.22);\n  --c-risk-text: #9C0F1A;   --c-risk-bg: rgba(156,15,26,0.06);  --c-risk-border: rgba(156,15,26,0.22);\n  --c-info-text: #2A5670;   --c-info-bg: rgba(42,86,112,0.06);  --c-info-border: rgba(42,86,112,0.22);\n  --c-neutral-text: rgba(31,26,20,0.48);\n  --c-neutral-bg: rgba(31,26,20,0.04);\n  --c-neutral-border: rgba(31,26,20,0.12);\n\n  /* ── NOTIF / TOAST ── */\n  --notif-bg: #FFFFFF;\n  --notif-border: rgba(120,75,30,0.12);\n  --toast-bg: #FFFFFF;\n  --toast-border: rgba(120,75,30,0.14);\n  --toast-shadow: 0 8px 24px rgba(80,50,15,0.10), 0 2px 4px rgba(80,50,15,0.05);\n\n  /* ── EFFECTS ── */\n  --noise-opacity: 0;\n  --scroll-track: var(--bg-primary);\n  --scroll-thumb: rgba(120,75,30,0.20);\n  --ambient-abyss-op: 0;\n  --ambient-molten-op: 0;\n\n  /* sidebar/inputs */\n  --sidebar-hover-bg: rgba(120,75,30,0.05);\n  --sidebar-active-bg: rgba(193,18,31,0.08);\n  --input-bg: #FFFFFF;\n}\n\n/* ─── LIGHT V2 — variantes de fundo (selecionáveis via Tweaks) ─── */\n/* \"linho\" é o padrão — menos saturado que o parchment original */\n[data-theme=\"light\"][data-light-bg=\"linho\"]   { --bg-primary: #EAE3D2; }   /* warm linen, baixa saturação */\n[data-theme=\"light\"][data-light-bg=\"parchment\"] { --bg-primary: #E8DEC2; } /* o parchment v2 original */\n[data-theme=\"light\"][data-light-bg=\"nevoa\"]   { --bg-primary: #ECEAE3; }   /* warm fog, quase neutro */\n[data-theme=\"light\"][data-light-bg=\"pedra\"]   { --bg-primary: #E4E2DA; }   /* stone, levemente fria */\n[data-theme=\"light\"][data-light-bg=\"ostra\"]   { --bg-primary: #EFEBE0; }   /* oyster, mais clara */\n\n/* Default fallback se nenhum data-light-bg estiver presente */\n[data-theme=\"light\"]:not([data-light-bg]) { --bg-primary: #EAE3D2; }\n\n/* ─── AJUSTES VISUAIS ESPECÍFICOS DO LIGHT V2 ─── */\n\n/* Body ganha textura sutil de papel */\n[data-theme=\"light\"] body {\n  background:\n    radial-gradient(ellipse at 80% -10%, rgba(193,18,31,0.04), transparent 50%),\n    radial-gradient(ellipse at 0% 110%, rgba(0,48,73,0.04), transparent 50%),\n    var(--bg-primary);\n}\n\n/* Cards e surfaces ganham sombras quentes para \"flutuar\" sobre a base */\n[data-theme=\"light\"] .card,\n[data-theme=\"light\"] .panel,\n[data-theme=\"light\"] .dash-section,\n[data-theme=\"light\"] .stepper,\n[data-theme=\"light\"] .ctx,\n[data-theme=\"light\"] .doc-head,\n[data-theme=\"light\"] .quick,\n[data-theme=\"light\"] .kpi-card,\n[data-theme=\"light\"] .alert,\n[data-theme=\"light\"] .source-card,\n[data-theme=\"light\"] .thread-item,\n[data-theme=\"light\"] .step-card,\n[data-theme=\"light\"] .risk-item,\n[data-theme=\"light\"] .role,\n[data-theme=\"light\"] .plan-card,\n[data-theme=\"light\"] .plan,\n[data-theme=\"light\"] .cap,\n[data-theme=\"light\"] .benefit,\n[data-theme=\"light\"] .signup-form,\n[data-theme=\"light\"] .hero-card,\n[data-theme=\"light\"] .workspace-card {\n  box-shadow:\n    0 1px 2px rgba(80,50,15,0.04),\n    0 4px 16px rgba(80,50,15,0.06);\n}\n\n[data-theme=\"light\"] .card:hover,\n[data-theme=\"light\"] .quick:hover,\n[data-theme=\"light\"] .thread-item:hover,\n[data-theme=\"light\"] .source-card:hover,\n[data-theme=\"light\"] .step-card:hover,\n[data-theme=\"light\"] .role:hover,\n[data-theme=\"light\"] .plan-card:hover {\n  box-shadow:\n    0 2px 4px rgba(80,50,15,0.06),\n    0 12px 28px rgba(80,50,15,0.10);\n}\n\n/* Hero card no light fica branco com borda quente sutil */\n[data-theme=\"light\"] .hero-card {\n  background: linear-gradient(160deg, #FFFFFF 0%, #FFFCF4 100%);\n  border-color: rgba(120,75,30,0.14);\n}\n\n/* Nav com fundo branco translúcido + sombra inferior */\n[data-theme=\"light\"] .nav {\n  background: rgba(255,255,255,0.85);\n  border-bottom: 1px solid rgba(120,75,30,0.10);\n  box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 2px 12px rgba(80,50,15,0.04);\n}\n\n/* Brand mark: borda quente em vez de glow */\n[data-theme=\"light\"] .brand-mark {\n  box-shadow: 0 2px 8px rgba(193,18,31,0.25), inset 0 1px 0 rgba(255,255,255,0.25);\n}\n\n/* Hero title em sólido com leve gradiente warm */\n[data-theme=\"light\"] .hero-title {\n  background: linear-gradient(135deg, #1F1A14 0%, #3A2818 60%, #6B2A1F 100%);\n  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;\n}\n[data-theme=\"light\"] .signup-title {\n  background: linear-gradient(135deg, #1F1A14 0%, #3A2818 100%);\n  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;\n}\n\n/* App-side surfaces no chat (history sidebar e composer) ganham contraste extra */\n[data-theme=\"light\"] .history,\n[data-theme=\"light\"] .sources {\n  background: #FAF6E9;\n}\n[data-theme=\"light\"] .chat {\n  background: var(--bg-primary);\n}\n[data-theme=\"light\"] .composer {\n  background: rgba(255,255,255,0.85);\n  border-top-color: rgba(120,75,30,0.12);\n}\n[data-theme=\"light\"] .composer-box {\n  background: #FFFFFF;\n}\n\n/* Doc page (preview) — fundo creme um pouco mais quente */\n[data-theme=\"light\"] .doc-page {\n  background: #FFFDF6;\n  border-right: 1px solid rgba(120,75,30,0.12);\n  color: #1F1A14;\n}\n\n/* AI response no light: borda esquerda steel, fundo branco */\n[data-theme=\"light\"] .bubble-ai,\n[data-theme=\"light\"] .ai-response,\n[data-theme=\"light\"] .executive {\n  background: #FFFFFF;\n}\n\n/* Inputs no light: fundo branco, sombra interna sutil */\n[data-theme=\"light\"] .input,\n[data-theme=\"light\"] .select,\n[data-theme=\"light\"] .textarea {\n  background: #FFFFFF;\n  box-shadow: inset 0 1px 2px rgba(80,50,15,0.04);\n}\n\n/* Severity bars no light: tons mais saturados */\n[data-theme=\"light\"] .severity-low  .severity-bar { background: #156B3A; }\n[data-theme=\"light\"] .severity-med  .severity-bar { background: #B6800A; }\n[data-theme=\"light\"] .severity-high .severity-bar { background: #9C0F1A; }\n\n/* tweaks panel: branco sobre creme */\n[data-theme=\"light\"] .tweaks {\n  background: #FFFFFF;\n  box-shadow: 0 16px 40px rgba(80,50,15,0.14);\n}\n[data-theme=\"light\"] .tweaks-seg { background: #FAF6E9; }\n[data-theme=\"light\"] .tweaks-seg button.active { background: #FFFFFF; box-shadow: 0 1px 3px rgba(80,50,15,0.10); }\n\n/* Plan featured no light */\n[data-theme=\"light\"] .plan.featured {\n  background: linear-gradient(180deg, #FFFFFF 0%, #FFFCF4 100%);\n}\n[data-theme=\"light\"] .plans { background: #FFFFFF; }\n\n/* Plan card de cadastro selecionado */\n[data-theme=\"light\"] .plan-card.is-active {\n  background: linear-gradient(135deg, #FFFCF4, #FFFFFF);\n}\n[data-theme=\"light\"] .role.is-active {\n  background: linear-gradient(135deg, #FFFCF4, #FFFFFF);\n}\n\n/* Final-cta hero gradient ajustado */\n[data-theme=\"light\"] .final-cta {\n  background:\n    radial-gradient(ellipse at 50% 0%, rgba(193,18,31,0.10), transparent 60%),\n    linear-gradient(180deg, #FFFFFF, #FFFCF4);\n  border-color: rgba(120,75,30,0.16);\n}\n\n/* Quote */\n[data-theme=\"light\"] .quote { background: #FFFFFF; }\n\n/* Trust */\n[data-theme=\"light\"] .trust { border-color: rgba(120,75,30,0.12); }\n\n/* doc-preview no light */\n[data-theme=\"light\"] .doc-preview { background: #FFFFFF; }\n[data-theme=\"light\"] .comments-rail { background: #FAF6E9; }\n[data-theme=\"light\"] .comment { background: #FFFFFF; }\n\n/* Tabela dashboard no light: zebra mais visível */\n[data-theme=\"light\"] .docs-table tr:hover td { background: rgba(120,75,30,0.04); }\n\n/* History items no light */\n[data-theme=\"light\"] .history-item.is-active { background: rgba(193,18,31,0.06); }\n\n/* Workspace card especial */\n[data-theme=\"light\"] .workspace-card { background: #FFFFFF; }\n[data-theme=\"light\"] .ws-avatar { background: linear-gradient(135deg, #003049, #00405F); color: #FDF0D5; }\n\n/* Footer divider */\n[data-theme=\"light\"] .footer { border-color: rgba(120,75,30,0.12); }\n\n/* Cross-version pill (link entre v1 e v2) */\n.version-pill {\n  display: inline-flex; align-items: center; gap: 4px;\n  font-family: var(--font-mono); font-size: 9px;\n  letter-spacing: 0.15em; text-transform: uppercase;\n  padding: 3px var(--s3); border-radius: var(--r-full);\n  background: var(--c-info-bg); color: var(--c-info-text);\n  border: 1px solid var(--c-info-border);\n  text-decoration: none; cursor: pointer;\n  transition: all var(--dur-fast);\n}\n.version-pill:hover { background: var(--c-info-border); }\n.version-pill-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }\n<\u002Fstyle>\n\n\n<style>\n  /* ── HERO ──────────────────────────────────────── */\n  .hero {\n    position: relative; padding: var(--s20) 0 var(--s16);\n    display: grid; grid-template-columns: 1.15fr 0.85fr; gap: var(--s12); align-items: center;\n  }\n  .hero-eyebrow {\n    font-family: var(--font-mono); font-size: 11px;\n    letter-spacing: 0.25em; text-transform: uppercase;\n    color: var(--text-accent); margin-bottom: var(--s5);\n    display: inline-flex; align-items: center; gap: var(--s3);\n  }\n  .hero-eyebrow::before { content: ''; width: 32px; height: 1px; background: currentColor; opacity: 0.5; }\n  .hero-title {\n    font-family: var(--font-display);\n    font-size: clamp(56px, 7vw, 92px); font-weight: 300;\n    letter-spacing: -0.025em; line-height: 0.95;\n    margin-bottom: var(--s6);\n  }\n  [data-theme=\"dark\"] .hero-title {\n    background: linear-gradient(135deg, var(--parchment) 0%, rgba(253,240,213,0.78) 45%, var(--steel) 100%);\n    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;\n  }\n  [data-theme=\"light\"] .hero-title { color: var(--abyss); }\n  .hero-title em { font-style: italic; font-weight: 400; }\n\n  .hero-lead {\n    font-size: 17px; color: var(--text-secondary); line-height: 1.7;\n    margin-bottom: var(--s8); max-width: 520px;\n  }\n\n  .hero-cta { display: flex; gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s8); }\n  .hero-meta { display: flex; gap: var(--s6); flex-wrap: wrap; align-items: center; }\n  .hero-meta-item { display: flex; gap: var(--s2); align-items: center; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-tertiary); }\n  .hero-meta-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--c-ok-text); box-shadow: 0 0 8px var(--c-ok-text); }\n\n  /* hero card — preview of AI response */\n  .hero-card {\n    position: relative;\n    background: linear-gradient(155deg, var(--bg-elevated), var(--bg-surface));\n    border: 1px solid var(--border-medium); border-radius: var(--r5);\n    padding: var(--s6); overflow: hidden;\n    box-shadow: 0 24px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(102,155,188,0.06);\n  }\n  .hero-card::before {\n    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;\n    background: linear-gradient(90deg, transparent, var(--border-accent), transparent);\n  }\n  .hc-head {\n    display: flex; align-items: center; justify-content: space-between;\n    padding-bottom: var(--s4); margin-bottom: var(--s4);\n    border-bottom: 1px solid var(--border-subtle);\n  }\n  .hc-doc { display: flex; align-items: center; gap: var(--s3); }\n  .hc-doc-icon {\n    width: 32px; height: 40px; border-radius: 2px;\n    background: linear-gradient(135deg, var(--bg-surface), var(--bg-elevated));\n    border: 1px solid var(--border-medium);\n    position: relative; flex-shrink: 0;\n  }\n  .hc-doc-icon::before { content: ''; position: absolute; top: 6px; left: 6px; right: 6px; height: 1px; background: var(--text-tertiary); box-shadow: 0 4px 0 var(--text-tertiary), 0 8px 0 var(--text-tertiary); }\n  .hc-doc-name { font-size: 13px; color: var(--text-primary); font-weight: 500; }\n  .hc-doc-meta { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.15em; color: var(--text-tertiary); }\n\n  .hc-section { margin-top: var(--s4); }\n  .hc-section-title { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-accent); margin-bottom: var(--s3); display: flex; align-items: center; gap: var(--s2); }\n  .hc-bullets { display: flex; flex-direction: column; gap: var(--s2); }\n  .hc-bullet { display: flex; gap: var(--s3); padding: var(--s3); background: rgba(102,155,188,0.04); border-left: 2px solid var(--steel); border-radius: 0 var(--r2) var(--r2) 0; }\n  .hc-bullet.risk { border-color: var(--c-risk-text); background: var(--c-risk-bg); }\n  .hc-bullet.warn { border-color: var(--c-warn-text); background: var(--c-warn-bg); }\n  .hc-bullet-num { font-family: var(--font-mono); font-size: 10px; color: var(--text-accent); flex-shrink: 0; min-width: 18px; }\n  .hc-bullet-body { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }\n  .hc-bullet-body strong { color: var(--text-primary); font-weight: 500; }\n\n  .hc-tags { display: flex; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s4); }\n\n  /* ── PRINCIPLES ─────────────────────────────────── */\n  .principles {\n    display: grid; grid-template-columns: repeat(4, 1fr);\n    gap: 0; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);\n    padding: var(--s8) 0; margin: var(--s10) 0;\n  }\n  .principle {\n    padding: 0 var(--s5); border-right: 1px solid var(--border-subtle);\n  }\n  .principle:last-child { border-right: none; }\n  .principle-num { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.15em; margin-bottom: var(--s3); }\n  .principle-title { font-family: var(--font-display); font-size: 22px; font-weight: 400; color: var(--text-primary); margin-bottom: var(--s2); line-height: 1.15; }\n  .principle-body { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }\n\n  /* ── CAPABILITIES (3 col) ───────────────────────── */\n  .caps {\n    display: grid; grid-template-columns: repeat(3, 1fr);\n    gap: var(--s5); margin-top: var(--s8);\n  }\n  .cap {\n    background: var(--bg-surface); border: 1px solid var(--border-subtle);\n    border-radius: var(--r4); padding: var(--s8); position: relative; overflow: hidden;\n    transition: all var(--dur-base) var(--ease-out-expo);\n  }\n  .cap::before {\n    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;\n    background: linear-gradient(90deg, transparent, var(--border-medium), transparent);\n  }\n  .cap:hover { border-color: var(--border-medium); transform: translateY(-2px); box-shadow: 0 12px 36px rgba(0,0,0,0.25); }\n  .cap-num { font-family: var(--font-mono); font-size: 10px; color: var(--text-accent); letter-spacing: 0.2em; margin-bottom: var(--s5); }\n  .cap-glyph {\n    width: 56px; height: 56px; border-radius: var(--r3);\n    display: grid; place-items: center; margin-bottom: var(--s5);\n    background: var(--bg-elevated); border: 1px solid var(--border-medium);\n    font-family: var(--font-display); font-size: 26px; color: var(--text-accent);\n  }\n  .cap-title { font-family: var(--font-display); font-size: 26px; font-weight: 400; color: var(--text-primary); margin-bottom: var(--s3); line-height: 1.1; }\n  .cap-body { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: var(--s5); }\n  .cap-list { display: flex; flex-direction: column; gap: var(--s2); list-style: none; }\n  .cap-list li { display: flex; gap: var(--s3); font-size: 12px; color: var(--text-tertiary); }\n  .cap-list li::before { content: '—'; font-family: var(--font-mono); color: var(--text-tertiary); }\n\n  /* ── FLOW STRIP ─────────────────────────────────── */\n  .flow {\n    background: var(--bg-surface); border: 1px solid var(--border-subtle);\n    border-radius: var(--r5); padding: var(--s10);\n    margin-top: var(--s10);\n  }\n  .flow-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s6); }\n  .flow-step { position: relative; padding-right: var(--s6); }\n  .flow-step:not(:last-child)::after {\n    content: ''; position: absolute; right: var(--s2); top: 12px; bottom: auto;\n    width: var(--s6); height: 1px; background: var(--border-subtle);\n  }\n  .flow-num { font-family: var(--font-mono); font-size: 11px; color: var(--text-accent); letter-spacing: 0.2em; margin-bottom: var(--s3); }\n  .flow-title { font-size: 15px; font-weight: 500; color: var(--text-primary); margin-bottom: var(--s2); }\n  .flow-body { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }\n\n  /* ── PLANS ──────────────────────────────────────── */\n  .plans {\n    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;\n    border: 1px solid var(--border-subtle); border-radius: var(--r4); overflow: hidden;\n    margin-top: var(--s8);\n  }\n  .plan {\n    padding: var(--s8); border-right: 1px solid var(--border-subtle);\n    background: var(--bg-surface);\n    display: flex; flex-direction: column; gap: var(--s4);\n  }\n  .plan:last-child { border-right: none; }\n  .plan.featured { background: linear-gradient(180deg, var(--bg-elevated), var(--bg-surface)); position: relative; }\n  .plan.featured::before {\n    content: 'Recomendado'; position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%);\n    background: var(--crimson); color: var(--parchment); font-family: var(--font-mono); font-size: 9px;\n    letter-spacing: 0.18em; text-transform: uppercase; padding: 4px var(--s3); border-radius: var(--r-full);\n  }\n  .plan-name { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-accent); }\n  .plan-price { font-family: var(--font-display); font-size: 48px; font-weight: 300; color: var(--text-primary); letter-spacing: -0.02em; line-height: 1; }\n  .plan-price em { font-family: var(--font-body); font-size: 14px; font-style: normal; color: var(--text-tertiary); font-weight: 400; letter-spacing: 0; margin-left: var(--s2); }\n  .plan-tag { font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--text-secondary); }\n  .plan-list { list-style: none; display: flex; flex-direction: column; gap: var(--s2); padding: var(--s4) 0; border-top: 1px solid var(--border-subtle); }\n  .plan-list li { display: flex; gap: var(--s3); font-size: 13px; color: var(--text-secondary); }\n  .plan-list li::before { content: '✓'; color: var(--c-ok-text); font-size: 11px; }\n  .plan-list li.off { color: var(--text-tertiary); }\n  .plan-list li.off::before { content: '—'; color: var(--text-tertiary); }\n\n  /* ── TRUST STRIP ────────────────────────────────── */\n  .trust {\n    display: flex; align-items: center; justify-content: center;\n    gap: var(--s10); flex-wrap: wrap;\n    padding: var(--s8) 0; margin: var(--s12) 0;\n    border-top: 1px solid var(--border-subtle);\n    border-bottom: 1px solid var(--border-subtle);\n  }\n  .trust-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-tertiary); }\n  .trust-item { font-family: var(--font-display); font-size: 20px; font-weight: 400; color: var(--text-secondary); letter-spacing: 0.04em; }\n\n  /* ── QUOTE ──────────────────────────────────────── */\n  .quote {\n    margin-top: var(--s10);\n    padding: var(--s10);\n    background: var(--bg-surface); border: 1px solid var(--border-subtle);\n    border-left: 3px solid var(--crimson);\n    border-radius: 0 var(--r4) var(--r4) 0;\n  }\n  .quote-text {\n    font-family: var(--font-display); font-style: italic; font-weight: 300;\n    font-size: 26px; line-height: 1.5; color: var(--text-primary);\n    margin-bottom: var(--s5);\n  }\n  .quote-cite { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; color: var(--text-tertiary); }\n  .quote-cite strong { color: var(--text-secondary); font-weight: 500; }\n\n  /* ── FINAL CTA ──────────────────────────────────── */\n  .final-cta {\n    margin-top: var(--s12);\n    text-align: center;\n    padding: var(--s12) var(--s8);\n    border: 1px solid var(--border-medium);\n    border-radius: var(--r5);\n    background:\n      radial-gradient(ellipse at 50% 0%, var(--glow-crimson), transparent 60%),\n      linear-gradient(180deg, var(--bg-elevated), var(--bg-surface));\n  }\n  .final-cta-title {\n    font-family: var(--font-display); font-size: clamp(36px, 5vw, 52px);\n    font-weight: 300; letter-spacing: -0.02em; line-height: 1.05;\n    margin-bottom: var(--s4); color: var(--text-primary);\n  }\n  .final-cta-sub {\n    font-family: var(--font-display); font-style: italic; font-size: 18px;\n    color: var(--text-secondary); margin-bottom: var(--s8);\n  }\n  .final-cta-row { display: inline-flex; gap: var(--s3); }\n\n  @media (max-width: 900px) {\n    .hero { grid-template-columns: 1fr; }\n    .principles { grid-template-columns: repeat(2, 1fr); }\n    .principle { border-right: none; border-bottom: 1px solid var(--border-subtle); padding-bottom: var(--s5); margin-bottom: var(--s5); }\n    .caps, .flow-grid, .plans { grid-template-columns: 1fr; }\n    .plan { border-right: none; border-bottom: 1px solid var(--border-subtle); }\n    .flow-step::after { display: none !important; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n\n<body data-page=\"landing\">\n<div class=\"ambient ambient-1\"><\u002Fdiv>\n<div class=\"ambient ambient-2\"><\u002Fdiv>\n\n<nav class=\"nav\">\n  <a class=\"brand\" href=\"01-landing-v2.html\">\n    <div class=\"brand-mark\">T<\u002Fdiv>\n    <div class=\"brand-name\">Tamois<\u002Fdiv>\n    <span class=\"brand-tag\">IA Jurídica<\u002Fspan>\n  <\u002Fa>\n  <ul class=\"nav-links\">\n    <li><a href=\"01-landing-v2.html\" data-page=\"landing\"><span class=\"nav-num\">01<\u002Fspan>Início<\u002Fa><\u002Fli>\n    <li><a href=\"02-analise-v2.html\" data-page=\"analise\"><span class=\"nav-num\">02<\u002Fspan>Análise<\u002Fa><\u002Fli>\n    <li><a href=\"03-chat-v2.html\" data-page=\"chat\"><span class=\"nav-num\">03<\u002Fspan>Chat<\u002Fa><\u002Fli>\n    <li><a href=\"05-painel-v2.html\" data-page=\"painel\"><span class=\"nav-num\">05<\u002Fspan>Painel<\u002Fa><\u002Fli>\n  <\u002Ful>\n  <div class=\"nav-actions\">\n    <a class=\"version-pill\" href=\"01-landing.html\" title=\"Ver versão original do light mode\"><span class=\"version-pill-dot\"><\u002Fspan>Light v2 · ver v1<\u002Fa>\n    <div class=\"theme-toggle\" id=\"themeToggle\">\n      <button class=\"theme-opt active\" data-t=\"dark\">Dark<\u002Fbutton>\n      <button class=\"theme-opt\" data-t=\"light\">Light<\u002Fbutton>\n    <\u002Fdiv>\n    <a href=\"04-cadastro-v2.html\" class=\"btn btn-ghost btn-sm\">Entrar<\u002Fa>\n    <a href=\"04-cadastro-v2.html\" class=\"btn btn-primary btn-sm\">Cadastre-se<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<main class=\"page\">\n<div class=\"container container-wide\">\n\n  <!-- ── HERO ────────────────────────────────────── -->\n  <section class=\"hero\">\n    <div class=\"fade-up fade-up-1\">\n      <div class=\"hero-eyebrow\">Inteligência aplicada ao Direito<\u002Fdiv>\n      <h1 class=\"hero-title\">A IA que pensa como <em>advogado<\u002Fem>.<\u002Fh1>\n      <p class=\"hero-lead\">\n        Tamois lê seus contratos, petições e pareceres, identifica riscos com referência normativa\n        e sugere os próximos passos jurídicos — direto no seu fluxo de trabalho.\n      <\u002Fp>\n      <div class=\"hero-cta\">\n        <a href=\"04-cadastro-v2.html\" class=\"btn btn-primary btn-lg\">Criar conta gratuita<\u002Fa>\n        <a href=\"02-analise-v2.html\" class=\"btn btn-secondary btn-lg\">Ver demonstração<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"hero-meta\">\n        <div class=\"hero-meta-item\"><div class=\"hero-meta-dot\"><\u002Fdiv>LGPD compliant<\u002Fdiv>\n        <div class=\"hero-meta-item\"><span style=\"color:var(--text-accent)\">◈<\u002Fspan>Base normativa atualizada diariamente<\u002Fdiv>\n        <div class=\"hero-meta-item\"><span style=\"color:var(--text-accent)\">✦<\u002Fspan>Treinada com jurisprudência BR<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hero-card fade-up fade-up-2\">\n      <div class=\"hc-head\">\n        <div class=\"hc-doc\">\n          <div class=\"hc-doc-icon\"><\u002Fdiv>\n          <div>\n            <div class=\"hc-doc-name\">Contrato de Prestação de Serviços<\u002Fdiv>\n            <div class=\"hc-doc-meta\">12 PÁGINAS · ANALISADO EM 8s<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"stag stag-ok\">Concluído<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"ai-response\" style=\"padding: var(--s5); margin-bottom: var(--s4)\">\n        <div class=\"ai-badge\"><div class=\"ai-dot\"><\u002Fdiv>Tamois · Resumo executivo<\u002Fdiv>\n        <div class=\"ai-text\" style=\"font-size: 14px; line-height: 1.7\">\n          Contrato de natureza <strong>civil<\u002Fstrong> entre prestador e tomador, com prazo de 24 meses\n          e cláusula de não-concorrência. Estrutura geral adequada, com <strong>2 pontos críticos<\u002Fstrong>\n          e <strong>3 ajustes recomendados<\u002Fstrong>.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"hc-section\">\n        <div class=\"hc-section-title\"><div class=\"ai-dot\"><\u002Fdiv>Próximos passos sugeridos<\u002Fdiv>\n        <div class=\"hc-bullets\">\n          <div class=\"hc-bullet risk\">\n            <div class=\"hc-bullet-num\">01<\u002Fdiv>\n            <div class=\"hc-bullet-body\"><strong>Revisar cláusula 7.2<\u002Fstrong> — multa rescisória superior ao limite jurisprudencial pacificado (STJ Tema 1.027).<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"hc-bullet warn\">\n            <div class=\"hc-bullet-num\">02<\u002Fdiv>\n            <div class=\"hc-bullet-body\"><strong>Adequar foro de eleição<\u002Fstrong> — incluir hipótese de hipossuficiência conforme art. 63, §3º do CPC.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"hc-bullet\">\n            <div class=\"hc-bullet-num\">03<\u002Fdiv>\n            <div class=\"hc-bullet-body\"><strong>Detalhar obrigações de LGPD<\u002Fstrong> — definir base legal de tratamento (art. 7º) e prazo de retenção.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"hc-tags\">\n        <span class=\"norm-tag\"><span class=\"norm-prefix\">LEI<\u002Fspan> 13.709/18<\u002Fspan>\n        <span class=\"norm-tag\"><span class=\"norm-prefix\">CPC<\u002Fspan> art. 63<\u002Fspan>\n        <span class=\"norm-tag\"><span class=\"norm-prefix\">STJ<\u002Fspan> Tema 1.027<\u002Fspan>\n        <span class=\"norm-tag\"><span class=\"norm-prefix\">CC<\u002Fspan> art. 422<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── PRINCIPLES ─────────────────────────────── -->\n  <section class=\"principles fade-up fade-up-3\">\n    <div class=\"principle\">\n      <div class=\"principle-num\">— I —<\u002Fdiv>\n      <div class=\"principle-title\">Sigilo absoluto<\u002Fdiv>\n      <div class=\"principle-body\">Documentos criptografados em trânsito e em repouso. Nada é usado para treinar modelos.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"principle\">\n      <div class=\"principle-num\">— II —<\u002Fdiv>\n      <div class=\"principle-title\">Citação obrigatória<\u002Fdiv>\n      <div class=\"principle-body\">Toda afirmação da IA vem acompanhada do dispositivo legal ou julgado que a fundamenta.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"principle\">\n      <div class=\"principle-num\">— III —<\u002Fdiv>\n      <div class=\"principle-title\">Base brasileira<\u002Fdiv>\n      <div class=\"principle-body\">Treinada com legislação, jurisprudência e doutrina nacional — sem traduções de modelos estrangeiros.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"principle\">\n      <div class=\"principle-num\">— IV —<\u002Fdiv>\n      <div class=\"principle-title\">Advogado no comando<\u002Fdiv>\n      <div class=\"principle-body\">A IA sugere. A decisão jurídica continua sendo, sempre, do operador do Direito.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── CAPABILITIES ───────────────────────────── -->\n  <section style=\"margin-top: var(--s16)\">\n    <div class=\"page-header\" style=\"margin-bottom: var(--s6)\">\n      <div>\n        <div class=\"section-label\">O que Tamois faz por você<\u002Fdiv>\n        <h2 class=\"t-display-lg\">Três frentes de trabalho jurídico.<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"caps\">\n      <div class=\"cap\">\n        <div class=\"cap-num\">— 01 —<\u002Fdiv>\n        <div class=\"cap-glyph\">⚖<\u002Fdiv>\n        <div class=\"cap-title\">Análise de documentos<\u002Fdiv>\n        <div class=\"cap-body\">\n          Envie contratos, petições, pareceres ou decisões. Receba resumo executivo, mapa de riscos\n          e próximos passos com fundamento normativo.\n        <\u002Fdiv>\n        <ul class=\"cap-list\">\n          <li>Resumo executivo e cronograma<\u002Fli>\n          <li>Identificação de cláusulas críticas<\u002Fli>\n          <li>Comentários direto no .docx<\u002Fli>\n          <li>Referências legais cruzadas<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"cap\">\n        <div class=\"cap-num\">— 02 —<\u002Fdiv>\n        <div class=\"cap-glyph\">◈<\u002Fdiv>\n        <div class=\"cap-title\">Pesquisa conversacional<\u002Fdiv>\n        <div class=\"cap-body\">\n          Faça perguntas em linguagem natural. Tamois consulta legislação, jurisprudência e doutrina\n          e refina a resposta com você.\n        <\u002Fdiv>\n        <ul class=\"cap-list\">\n          <li>Refinamento jurídico passo a passo<\u002Fli>\n          <li>Citação de julgados pertinentes<\u002Fli>\n          <li>Comparativo entre teses<\u002Fli>\n          <li>Histórico salvo por matéria<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"cap\">\n        <div class=\"cap-num\">— 03 —<\u002Fdiv>\n        <div class=\"cap-glyph\">⬡<\u002Fdiv>\n        <div class=\"cap-title\">Redação assistida<\u002Fdiv>\n        <div class=\"cap-body\">\n          Modelos contextualizados para sua área e revisão automática de minutas em .doc/.docx\n          com comentários inline.\n        <\u002Fdiv>\n        <ul class=\"cap-list\">\n          <li>Comentários inline no Word<\u002Fli>\n          <li>Sugestões de redação alternativa<\u002Fli>\n          <li>Conformidade com CPC e LGPD<\u002Fli>\n          <li>Exportação direta<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── FLOW ───────────────────────────────────── -->\n  <section style=\"margin-top: var(--s16)\">\n    <div class=\"page-header\" style=\"margin-bottom: var(--s6)\">\n      <div>\n        <div class=\"section-label\">Como funciona<\u002Fdiv>\n        <h2 class=\"t-display-lg\">Quatro passos. Sem fricção.<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"flow\">\n      <div class=\"flow-grid\">\n        <div class=\"flow-step\">\n          <div class=\"flow-num\">— PASSO 01 —<\u002Fdiv>\n          <div class=\"flow-title\">Cadastre-se como operador<\u002Fdiv>\n          <div class=\"flow-body\">Conta gratuita em segundos. Indique se é estudante, advogado ou área correlata.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"flow-step\">\n          <div class=\"flow-num\">— PASSO 02 —<\u002Fdiv>\n          <div class=\"flow-title\">Contextualize a análise<\u002Fdiv>\n          <div class=\"flow-body\">Área do Direito, tipo de documento, objetivo e parte representada — em 30 segundos.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"flow-step\">\n          <div class=\"flow-num\">— PASSO 03 —<\u002Fdiv>\n          <div class=\"flow-title\">Envie ou pergunte<\u002Fdiv>\n          <div class=\"flow-body\">Faça upload do documento, peça uma análise, ou abra um chat conversacional.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"flow-step\">\n          <div class=\"flow-num\">— PASSO 04 —<\u002Fdiv>\n          <div class=\"flow-title\">Receba o parecer<\u002Fdiv>\n          <div class=\"flow-body\">Resumo, riscos, próximos passos e — quando aplicável — o arquivo comentado.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── QUOTE ──────────────────────────────────── -->\n  <section class=\"quote\">\n    <p class=\"quote-text\">\n      \"Tamois não substitui o advogado. Substitui as horas que ele gasta em tarefas que não exigem\n      o seu melhor julgamento — para que sobre tempo para o que exige.\"\n    <\u002Fp>\n    <div class=\"quote-cite\">— <strong>Manifesto Tamois<\u002Fstrong> · Inteligência Jurídica<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ── PLANS ──────────────────────────────────── -->\n  <section style=\"margin-top: va
