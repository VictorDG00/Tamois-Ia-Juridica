# Deploy — roda no self-hosted runner da VPS, só em push na main (pós-merge aprovado).
# Tamois roda via docker compose (NÃO Kamal): compose no próprio repo, SRC_DIR == COMPOSE_DIR.
# O volume tamois_storage persiste o sqlite/uploads entre rebuilds.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-tamois
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: [self-hosted, vps-prod]
    env:
      SRC_DIR: /home/victor/Projetos/Publicado/Tamois-Ia-Juridica
      COMPOSE_DIR: /home/victor/Projetos/Publicado/Tamois-Ia-Juridica
      REPO: VictorDG00/Tamois-Ia-Juridica
      CONTAINER: tamois
    steps:
      - name: Atualizar código de produção
        run: |
          # safe.directory: o runner roda como root e alguns repos têm .git de outro dono
          git config --global --add safe.directory "$SRC_DIR"
          cd "$SRC_DIR"
          git fetch "https://x-access-token:${{ github.token }}@github.com/${REPO}.git" main
          git reset --hard FETCH_HEAD

      - name: Rebuild e subir container (aguarda ficar healthy)
        run: |
          cd "$COMPOSE_DIR"
          docker compose up -d --build --wait --wait-timeout 180

      - name: Logs em caso de falha
        if: failure()
        run: |
          cd "$COMPOSE_DIR"
          docker compose logs --tail=80 "$CONTAINER" || true
